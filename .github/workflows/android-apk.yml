name: CodexLocal Android APK + PC checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "shell/**"
      - "scripts/**"
      - "pc/**"
      - "gradle/**"
      - "gradlew"
      - "*.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-python:
    name: Verifier le terminal Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntaxe Python
        run: python -m py_compile pc/codexlocal.py pc/codexlocal_gui.py pc/test_desktop.py
      - name: Tests du mode Codex/Chat PC (sans fenêtre graphique)
        run: python -m unittest discover -s pc -p "test_*.py" -v
      - name: Aide et detection (sans agent obligatoire)
        run: |
          python pc/codexlocal.py --help
          python pc/codexlocal.py --list-agents
      - name: Demarrer la fenetre graphique sur ecran virtuel
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::error::xvfb-run absent du runner"
            exit 1
          fi
          xvfb-run -a python - <<'PY'
          import sys
          import tkinter as tk
          from pathlib import Path
          sys.path.insert(0, "pc")
          from codexlocal_gui import CodexDesktop, SKY, ORANGE

          root = tk.Tk()
          app = CodexDesktop(root, Path.cwd())
          # Vérifier un écran PC compact : le compositeur doit rester visible.
          root.geometry("740x570")
          root.update()
          assert app.mode == "codex" and app.accent == ORANGE
          assert app.input.winfo_viewable(), "Zone d'écriture masquée"
          assert app.input.winfo_height() >= 45, "Champ d'écriture trop petit"
          assert app.composer_border.winfo_rooty() + app.composer_border.winfo_height() <= root.winfo_rooty() + root.winfo_height(), "Zone d'écriture hors de l'écran"
          app._set_mode("chat")
          root.update_idletasks()
          assert app.mode == "chat" and app.accent == SKY
          app._set_mode("codex")
          assert app.mode == "codex"
          root.destroy()
          print("OK : fenetre MARCEAU, modes Codex et Chat")
          PY

  apk-debug:
    name: Compiler APK Android de test
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # L'image GitHub Ubuntu fournit deja sdkmanager et ANDROID_HOME.
      # setup-android@v3 tente d'installer un paquet 'tools' obsolete.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Installer SDK, NDK et CMake compatibles
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$ANDROID_SDK" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "::error::sdkmanager absent du runner GitHub ($ANDROID_SDK)"
            exit 1
          fi
          echo "Utilisation de $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Recuperer llama.cpp v0.6.0 (code source natif)
        run: |
          git clone --depth 1 --branch v0.6.0 https://github.com/ggml-org/llama.cpp.git lib/src/main/cpp/llama.cpp
      - name: Compiler APK arm64-v8a (debug)
        env:
          CODEXLOCAL_KEYSTORE_BASE64: ${{ secrets.CODEXLOCAL_KEYSTORE_BASE64 }}
        run: |
          # The same key is needed on every build for Android to allow an update.
          if [ -n "$CODEXLOCAL_KEYSTORE_BASE64" ]; then
            printf '%s' "$CODEXLOCAL_KEYSTORE_BASE64" | base64 --decode > app/codexlocal.keystore
          else
            echo "::warning::CODEXLOCAL_KEYSTORE_BASE64 absent : APK de test, mise à jour d'une installation précédente non garantie."
          fi
          # La propriété org.gradle.java.home du projet pointe vers le PC Windows.
          # Elle n'est valable que localement, pas sur le runner Linux.
          sed -i '/^[[:space:]]*org.gradle.java.home[[:space:]]*=/d' gradle.properties
          chmod +x gradlew
          # Le modele d'APK du Studio (module :shell) d'abord : on le verifie avant les tests.
          ./gradlew :app:copierModeleApk --stacktrace --no-daemon
          python3 scripts/verifier_modele_apk.py app/build/generated/modeleApk/assets/modele-shell.apk
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: CodexLocal-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Publie l'APK dans une release GitHub : l'appli la detecte toute seule
  # (UpdateChecker -> releases/latest). La version suit automatiquement le
  # numero de compilation (1.5.<numero>), voir app/build.gradle.kts.
  publier-release:
    name: Publier la release (mise a jour automatique)
    needs: apk-debug
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CodexLocal-Android-Debug-APK
          path: apk
      - name: Creer la release de cette compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.5.${GITHUB_RUN_NUMBER}"
          TAG="v$VERSION"
          APK="$(ls apk/*.apk | head -n1)"
          cp "$APK" "CodexLocal-$VERSION.apk"
          gh release create "$TAG" "CodexLocal-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "CodexLocal $VERSION" \
            --notes "Version $VERSION, compilee automatiquement. L'appli propose cette mise a jour au demarrage."
