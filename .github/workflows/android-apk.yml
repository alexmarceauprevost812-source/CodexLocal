name: CodexLocal Android APK + PC checks

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "pc/**"
      - "gradle/**"
      - "gradlew"
      - "*.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-python:
    name: Verifier le terminal Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntaxe Python
        run: python -m py_compile pc/codexlocal.py
      - name: Aide et detection (sans agent obligatoire)
        run: |
          python pc/codexlocal.py --help
          python pc/codexlocal.py --list-agents

  apk-debug:
    name: Compiler APK Android de test
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # L'image GitHub Ubuntu fournit deja sdkmanager et ANDROID_HOME.
      # setup-android@v3 tente d'installer un paquet 'tools' obsolete.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Installer SDK, NDK et CMake compatibles
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Recuperer llama.cpp v0.6.0 (code source natif)
        run: |
          git clone --depth 1 --branch v0.6.0 https://github.com/ggml-org/llama.cpp.git lib/src/main/cpp/llama.cpp
      - name: Compiler APK arm64-v8a (debug)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Publier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: CodexLocal-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
